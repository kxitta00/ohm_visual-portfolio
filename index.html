<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ohm_visual-portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap"
    rel="stylesheet">
</head>

<body>
  <!-- Header -->
  <header>
    <div class="header-container">
      <a href="/" class="logo">O H M _ V I S U A L</a>
      <nav class="nav-links" id="nav-links">
        <a href="#works">ผลงาน</a>
        <a href="#pricing">ราคา</a>
        <a href="#about">เกี่ยวกับ</a>
        <a href="#contact" class="btn-book">จองคิว</a>
      </nav>
      <button class="menu-btn" id="menu-btn">☰</button>
    </div>
  </header>
  <!-- Main -->
  <main>
    <!-- Hero -->
    <section class="hero" id="hero">
      <div class="container hero-container">
        <div class="hero-content">
          <span class="category-title">GRADUATION · PORTRAIT · PORTFOLIO</span>
          <h1 class="hero-title">เก็บวันสำคัญ<br>ให้เป็นภาพที่อยู่นาน</h1>
          <p class="hero-desc">รับถ่ายรูปรับปริญญา พอร์ตเทรต และพอร์ตฟอลิโอ ด้วยแสง<br>
            ธรรมชาติและบรรยกาศสบายๆ[ใส่ประโยคแนะนำของช่างภาพ]
          </p>
          <a href="#contact" class="btn-hero">จองคิว / ติดต่องาน</a>
        </div>
        <div class="hero-image">
          <div class="hero-bagde">ohm_visual</div>
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1000&q=80"
            alt="ภาพตัวอย่างรับปริญญาและพอร์ตเทรต">
        </div>
      </div>
    </section>
    <!-- Works ผลงาน 9 รูป -->
    <section class="works" id="works">
      <div class="container works-container"></div>
    </section>
    <!-- Pricing ตารางเรทราคา -->
    <section class="pricing" id="pricing">
      <div class="container pricing-container"></div>
    </section>
    <!-- About ประวัติและอุปกรณ์ -->
    <section class="about" id="about">
      <div class="container about-container"></div>
    </section>
    <!-- Contact ติดต่อ -->
    <section class="cta" id="contact">
      <div class="container cta-container"></div>
    </section>
  </main>
  <!-- Footer -->
  <footer>
    <div class="footer-container"></div>
  </footer>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
